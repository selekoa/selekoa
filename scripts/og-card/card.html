<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
      }
      body {
        width: 1200px;
        height: 627px;
        background: #f4f2eb;
        color: #27342f;
        font-family: Georgia, 'Times New Roman', serif;
        box-sizing: border-box;
        position: relative;
        overflow: hidden;
      }
      .frame {
        position: absolute;
        inset: 0;
        padding: 64px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .wm {
        font-weight: bold;
        font-size: 64px;
        letter-spacing: -3px;
        line-height: 1;
      }
      .wm span {
        color: #bd6b3e;
      }
      h1 {
        font-weight: normal;
        font-size: 54px;
        line-height: 1.15;
        margin: 0 0 28px;
        letter-spacing: -0.5px;
      }
      p {
        font-size: 29px;
        line-height: 1.45;
        margin: 0;
        max-width: 960px;
        color: #27342f;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: 21px;
        color: #626961;
      }
      .rule {
        position: absolute;
        left: 80px;
        right: 80px;
        bottom: 112px;
        height: 1px;
        background: #d9dcd2;
      }
      .url {
        color: #214e42;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="wm">selekoa<span>.</span></div>
      <div>
        <h1>A documentary history of machine intelligence.</h1>
        <p>
          Machines find the sources, quote them and check each other’s work.
          What they leave to <b>you</b> is the <i>human part</i>: the question,
          the point of view, the stance.
        </p>
      </div>
      <div class="foot">
        <span>Every statement links to the passage it rests on.</span
        ><span class="url">selekoa.org</span>
      </div>
    </div>
    <div class="rule"></div>
  </body>
</html>
