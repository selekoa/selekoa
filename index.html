<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A documentary history of machine intelligence. Records of people, institutions, documents, capital and governance, each linked to its source passage."
    />
    <!-- Indexing is switched in site.config.json; see docs/launch-runbook.md. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Selekoa · A documentary history of machine intelligence</title>
    <script>
      // The reader's stored theme, before the first paint (see src/App.tsx).
      try {
        const theme = localStorage.getItem('selekoa-theme');
        if (theme === 'light' || theme === 'dark')
          document.documentElement.dataset.selekoaTheme = theme;
      } catch {
        // Storage can be blocked; the system setting applies.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p
        style="
          font:
            16px/1.5 Georgia,
            serif;
          max-width: 40em;
          margin: 2em auto;
          padding: 0 16px;
        "
      >
        Selekoa is a documentary history of machine intelligence. This page
        needs JavaScript to show the records.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
